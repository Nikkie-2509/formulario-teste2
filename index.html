<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adoção</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

 <div class="todoConteudo">
        <div class="container">
            <h1>Amor de pet</h1>
            <h2>Sistema de adoção</h2>
        
            <form>

                <div class="form-control">
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome"/>
                </div>

                <div class="form-control">
                    <label for="email">E-mail:</label>
                    <input type="text" id="email">
                </div>

                <div class="form-control">
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha">
                </div>

                <div class="form-control">
                    <label for="telefone">Telefone:</label>
                    <input type="text" id="telefone">
                </div>

                <div class="form-control">
                    <label for="data">Data de nascimento:</label>
                    <input type="date" id="data">
                </div>

                <div class="form-control">
                    <label for="especie">Que tipo de animal <strong>você</strong> está procurando?</label>
                    <select id="especie">
                        <option value="">Selecione</option>
                        <option value="aves">Aves</option>
                        <option value="felinos">Gatos</option>
                        <option value="cães">Cachorros</option>
                        <option value="agua">Animais aquáticos</option>
                    </select>
                </div>

                <div class="formulario">
                    <button type="submit" class="cadastro">Cadastrar</button>
                    <button type="reset" class="limpeza">Limpar</button>
                </div>

            </form>

        </div>

    </div>

</body>
</html>
